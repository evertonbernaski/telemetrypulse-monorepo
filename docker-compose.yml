services:
  postgres:
    image: postgres:16-alpine
    container_name: telemetrypulse-postgres
    environment:
      POSTGRES_DB: telemetrypulse
      POSTGRES_USER: telemetrypulse
      POSTGRES_PASSWORD: telemetrypulse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetrypulse -d telemetrypulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  telemetry-processor:
    build:
      context: .
      dockerfile: apps/telemetry-processor/Dockerfile
    container_name: telemetrypulse-processor
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/telemetrypulse
      SPRING_DATASOURCE_USERNAME: telemetrypulse
      SPRING_DATASOURCE_PASSWORD: telemetrypulse
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  fleet-dashboard:
    build:
      context: .
      dockerfile: apps/fleet-dashboard/Dockerfile
    container_name: telemetrypulse-dashboard
    ports:
      - "4200:80"
    depends_on:
      - telemetry-processor

volumes:
  postgres-data:
